# Phosh compositor (phoc) configuration for Samsung Galaxy Tab S7 LTE (SM-T875).
# Physical panel: 11" 2560x1600 LCD (NT36523), ~274 dpi.

[output:DSI-1]
scale = 2

[output:Virtual-1]
modeline = 138.50  1920 1968 2000 2080  1200 1203 1209 1235 +hsync -vsync
mode = 1920x1200
scale = 1

[output:X11-1]
mode = 1280x800
scale = 1

[output:WL-1]
mode = 1280x800
scale = 1

[output:HWCOMPOSER-1]
# 2560x1600 / 2 = 1280x800 logical resolution
scale = 2
